<?xml version="1.0" encoding="UTF-8"?>
<!--
  Official HASA logo (crimson shield + Africa silhouette + HASA wordmark).

  Two deliberate changes from the source export:
   1. font-family carries a real fallback stack. The export named "HelveticaNeue",
      which does not exist on Windows/Linux/Android; Arial is metrically compatible
      with Helvetica so the wordmark holds its shape everywhere.
   2. text-anchor="middle" with the translate at half the viewBox width (112.72),
      so "HASA" stays centred on the shield no matter which font resolves. The
      export pinned it to x=107.61 with no anchor, which sat off-centre.
-->
<svg id="Layer_2" data-name="Layer 2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 225.43 264.46">
  <defs>
    <style>
      .cls-1 {
        font-family: "Helvetica Neue", HelveticaNeue, Helvetica, Arial, sans-serif;
        font-size: 38.05px;
        letter-spacing: .1em;
        stroke: #fff;
      }

      .cls-1, .cls-2 {
        fill: #fff;
      }

      .cls-3 {
        fill: #963934;
      }
    </style>
  </defs>
  <g id="Layer_1-2" data-name="Layer 1">
